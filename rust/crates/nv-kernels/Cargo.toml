[package]
name = "nv-kernels"
version = "0.0.1"
edition.workspace = true
publish.workspace = true
links = "nv_kernels"

[dependencies]
anyhow = { workspace = true }
cudarc = { workspace = true, optional = true }
half = { workspace = true }
wgpu = { version = "=30.0.0", default-features = false, features = ["std", "wgsl", "vulkan", "metal", "dx12"], optional = true }
pollster = { version = "0.4", optional = true }
bytemuck = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[build-dependencies]
cc = { workspace = true }
bindgen = { workspace = true }

[features]
default = []
cuda = ["dep:cudarc", "nv-quant/cuda"]
rocm = []
metal = []
wgpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]

[dev-dependencies]
half = { workspace = true }
log = "0.4"
naga = { version = "=30.0.0", features = ["wgsl-in", "msl-out"] }
nv-quant = { workspace = true }

[lints]
workspace = true
