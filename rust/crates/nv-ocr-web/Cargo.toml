[package]
name = "nv-ocr-web"
version = "0.0.1"
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[[example]]
name = "nvk-e4b-window-dump"
required-features = ["browser"]

[dependencies]
anyhow = { workspace = true }
candle-core = { workspace = true }
half = { workspace = true }
nv-config = { workspace = true }
nv-kernels = { workspace = true }
nv-quant = { workspace = true }
nv-weights = { workspace = true }
nv-models = { workspace = true }
nv-ocr = { workspace = true }
nv-tts = { workspace = true }
safetensors = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "=30.0.0", default-features = false, features = ["std", "wgsl", "webgpu", "fragile-send-sync-non-atomic-wasm"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"

[dev-dependencies]
pollster = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokenizers = { workspace = true }

[features]
default = []
browser = ["nv-models/wgpu", "nv-kernels/wgpu"]

[lints]
workspace = true
