[package]
name = "nv-laya"
version = "0.0.1"
edition.workspace = true
publish.workspace = true

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
candle-core = { workspace = true }
candle-nn = { workspace = true }
candle-flash-attn = { workspace = true, optional = true }
candle-metal-kernels = { version = "0.11", optional = true }
nv-kernels = { workspace = true, optional = true }
nv-quant = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokenizers = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokenizers = { version = "0.23", default-features = false, features = ["unstable_wasm"] }

[features]
default = []
cuda = ["candle-core/cuda", "candle-nn/cuda", "dep:nv-kernels", "nv-kernels/cuda", "dep:nv-quant", "nv-quant/cuda"]
flash-attn = ["cuda", "dep:candle-flash-attn"]
metal = ["candle-core/metal", "candle-nn/metal", "dep:candle-metal-kernels"]

[lints]
workspace = true
