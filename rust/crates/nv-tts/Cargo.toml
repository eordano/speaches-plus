[package]
name = "nv-tts"
version = "0.0.1"
edition.workspace = true
publish.workspace = true

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
candle-core = { workspace = true }
candle-nn = { workspace = true }
nv-config = { workspace = true }
nv-layers = { workspace = true }
nv-omni = { workspace = true }
nv-weights = { workspace = true }
tokenizers = { workspace = true }

[features]
default = []
cuda = ["candle-core/cuda", "candle-nn/cuda", "nv-layers/cuda"]
metal = ["candle-core/metal", "candle-nn/metal", "nv-layers/metal"]
stale-examples = []

[[example]]
name = "codec_bench"
required-features = ["stale-examples"]

[[example]]
name = "parity_dbg"
required-features = ["stale-examples"]

[lints]
workspace = true
