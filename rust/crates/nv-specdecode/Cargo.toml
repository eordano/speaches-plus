[package]
name = "nv-specdecode"
version = "0.0.1"
edition.workspace = true
publish.workspace = true

[dependencies]
anyhow = { workspace = true }
candle-core = { workspace = true }
candle-nn = { workspace = true }
cudarc = { workspace = true, optional = true }
half = { workspace = true }
nv-config = { workspace = true }
nv-kernels = { workspace = true, optional = true }
nv-layers = { workspace = true }
nv-lookup = { workspace = true }
nv-engine = { workspace = true }
nv-models = { workspace = true, optional = true }
nv-quant = { workspace = true, optional = true }
nv-weights = { workspace = true }
safetensors = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[features]
default = []
wgpu = [
    "dep:nv-kernels",
    "dep:nv-models",
    "nv-kernels/wgpu",
    "nv-models/wgpu",
    "nv-layers/wgpu",
]
cuda = [
    "dep:cudarc",
    "dep:nv-models",
    "dep:nv-kernels",
    "dep:nv-quant",
    "candle-core/cuda",
    "nv-layers/cuda",
    "nv-engine/cuda",
    "nv-models/cuda",
    "nv-kernels/cuda",
    "nv-quant/cuda",
]

[dev-dependencies]
tokenizers = { workspace = true }
nv-kernels = { workspace = true }
nv-models = { workspace = true }
minijinja = { workspace = true }
minijinja-contrib = { workspace = true }

[lints]
workspace = true
